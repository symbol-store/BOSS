<!DOCTYPE html>
<meta charset="utf-8">
<html>

<head>
    <title>Visualisation Page (REST version)</title>
</head>

<body>
    <h1>Visualisation Page (REST version)</h1>

    <div id="my_dataviz"></div>

    <div>
        <input type="text" id="urlbox" name="urlbox"></input>
        <button onclick="renderRestData()">render</button>
    </div>

    <script src="https://d3js.org/d3.v4.min.js"></script>

    <!-- K: TODO: can't seem to import external js file, for who knows what reason. -->
    <!-- <script src="d3.min.js"></script> -->
    <!-- <script src="visualisationscript.js"></script> -->

    <script>

        // K: function to make the data a csv
        function csvify(data) {
            //substitute racket characters with csv characters

            //divide header from data
            arr = data.split(";");

            //on header:
            //insert ,
            arr[0] = arr[0].replaceAll(") (", ",");
            //strip parenthesis
            arr[0] = arr[0].replaceAll("((", "");
            arr[0] = arr[0].replaceAll("))", "");
            //strip racket chars
            arr[0] = arr[0].replaceAll("$0", "_");

            //on data:
            //insert \n
            arr[1] = arr[1].replaceAll(") (", "\n");
            //insert comas
            arr[1] = arr[1].replaceAll(" ", ",");
            //strip double quotes
            arr[1] = arr[1].replaceAll("\"", "");
            //strip parenthesis
            arr[1] = arr[1].replaceAll("((", "");
            arr[1] = arr[1].replaceAll("))", "");

            console.log("arr 0 : " + arr[0]);
            console.log("arr 1 : " + arr[1]);
            data = arr[0] + "\n" + arr[1];
            return data;
        }

        //function to be called from a button
        function renderRestData() {
            //get url from textbox
            url = d3.select("#urlbox").property("value").trim();
            if (url == "") return;
            console.log("url is " + url);
            //get data from rest api
            // url = "http://localhost:8000/rest/NumbersTable/:/Project/:/As/x/xnumber/y/ynumber/desc/description"
            fetch(url).then((res) => {
                res.text().then((data) => {
                    console.log("original data is " + data);
                    data = csvify(data);

                    data = d3.csvParse(data);
                    console.log("new data is: ");
                    console.log(data);

                    d3Print(data, url);
                });
            });
        }

        //function to pilot d3 printings
        function d3Print(data, url) {
            if (url == "http://localhost:8000/rest/NumbersTable/:/Project/:/As/x/xnumber/y/ynumber/desc/description") {
                d3Numbers(data);
            }

            if (url == "http://localhost:8000/rest/BatteryDataMOD/:/Project/:/As/id/id/modId/modId/battId/battId/groupId/groupId/ts/ts/VBat_V/VBat_V/IBat_A/IBat_A/TBat_degC/TBat_degC/TPwr_degC/TPwr_degC/RBat_ohm/RBat_ohm/currentThroughput_kAh/currentThroughput_kAh/currentThroughput_Ah/currentThroughput_Ah/energyThroughput_kWh/energyThroughput_kWh/energyThroughput_Wh/energyThroughput_Wh/PBat_W/PBat_W/soh_pct/soh_pct/soc_pct/soc_pct/capacity_Ah/capacity_Ah/energyCapacityWh/energyCapacityWh/Rbat_ohm/Rbat_ohm") {
                d3MOD(data);
            }

            if (url == "http://localhost:8000/rest/BatteryDataMSTR/:/Project/:/As/id/id/battId/battId/groupId/groupId/ts/ts/Vsys_V/Vsys_V/Vsysout_V/Vsysout_V/Isys_A/Isys_A/Psys_W/Psys_W/soh_pct/soh_pct/soc_pct/soc_pct") {
                d3MSTR(data);
            }
        }

        function d3Numbers(data) {
            // set the dimensions and margins of the graph
            var margin = { top: 10, right: 30, bottom: 30, left: 60 },
                width = 460 - margin.left - margin.right,
                height = 400 - margin.top - margin.bottom;

            // append the svg object to the body of the page
            var svg = d3.select("#my_dataviz")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform",
                    "translate(" + margin.left + "," + margin.top + ")");

            // Add X axis
            var x = d3.scaleLinear()
                .domain([0, d3.max(data, function (d) { return +d.x + 1; })])
                .range([0, width]);
            svg.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(d3.axisBottom(x));

            // Add Y axis
            var y = d3.scaleLinear()
                .domain([0, d3.max(data, function (d) { return +d.y + 1; })])
                .range([height, 0]);
            svg.append("g")
                .call(d3.axisLeft(y));

            // Add the line
            svg.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "steelblue")
                .attr("stroke-width", 1.5)
                .attr("d", d3.line()
                    .x(function (d) { return x(d.x) })
                    .y(function (d) { return y(d.y) })
                );
        }

        function d3MOD(data) {
            //fix data timestamp
            data.forEach(element => {
                element.ts = new Date(element.ts * 1000);
            });

            // set the dimensions and margins of the graph
            var margin = { top: 10, right: 30, bottom: 30, left: 60 },
                width = 460 - margin.left - margin.right,
                height = 400 - margin.top - margin.bottom;

            // append the svg object to the body of the page
            var svg = d3.select("#my_dataviz")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform",
                    "translate(" + margin.left + "," + margin.top + ")");

            // Add X axis --> it is a date format
            var x = d3.scaleTime()
                .domain(d3.extent(data, function (d) { return d.ts; }))
                .range([0, width]);
            svg.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(d3.axisBottom(x));

            // Add Y axis
            var y = d3.scaleLinear()
                .domain([0, d3.max(data, function (d) { return +parseFloat(d.energyThroughput_Wh) + 1; })])
                .range([height, 0]);
            svg.append("g")
                .call(d3.axisLeft(y));

            // Add the line
            svg.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "steelblue")
                .attr("stroke-width", 1.5)
                .attr("d", d3.line()
                    .x(function (d) { return x(d.ts) })
                    .y(function (d) { return y(parseFloat(d.energyThroughput_Wh)) })
                );
        }

        function d3MSTR(data) {
            //fix data timestamp
            data.forEach(element => {
                element.ts = new Date(element.ts * 1000);
            });

            // set the dimensions and margins of the graph
            var margin = { top: 10, right: 30, bottom: 30, left: 60 },
                width = 460 - margin.left - margin.right,
                height = 400 - margin.top - margin.bottom;

            // append the svg object to the body of the page
            var svg = d3.select("#my_dataviz")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform",
                    "translate(" + margin.left + "," + margin.top + ")");

            // Add X axis
            // var x = d3.scaleLinear()
            //     .domain([0, d3.max(data, function (d) { return +d.ts + 1; })])
            //     .range([0, width]);
            // svg.append("g")
            //     .attr("transform", "translate(0," + height + ")")
            //     .call(d3.axisBottom(x));

            // Add X axis --> it is a date format
            var x = d3.scaleTime()
                .domain(d3.extent(data, function (d) { return d.ts; }))
                .range([0, width]);
            svg.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(d3.axisBottom(x));

            // Add Y axis
            var y = d3.scaleLinear()
                // .domain([0, d3.max(data, function (d) { return +parseFloat(d.soc_pct) + 1; })])
                .domain([0, 100])
                .range([height, 0]);
            svg.append("g")
                .call(d3.axisLeft(y));

            // Add the line
            svg.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "steelblue")
                .attr("stroke-width", 1.5)
                .attr("d", d3.line()
                    .x(function (d) { return x(d.ts) })
                    .y(function (d) { return y(parseFloat(d.soc_pct)) })
                );
        }





    </script>
</body>

</html>
