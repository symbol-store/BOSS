<!DOCTYPE html>
<meta charset="utf-8">
<html>

<head>
    <title>REST example page</title>
</head>

<body>
    <h1>REST example page</h1>

    <div>Example REST queries:
        <ul>
            <li>http://localhost:8000/rest/NumbersTable/:/Project/:/As/x/xnumber/y/ynumber/desc/description</li>
            <li>http://localhost:8000/rest/Customer/:/Project/:/As/Name/FirstName/Last/LastName/Age/age</li>
        </ul>
    </div>

    <div>
        <input type="text" id="urlbox" name="urlbox"></input>
        <button onclick="printRestData()">fetch & print</button>
    </div>

    <div id="my_dataviz"></div>

    <!-- default racket htdocs folder: /usr/share/racket/pkgs/web-server-lib/web-server/default-web-root/htdocs -->
    <script src="restExample.js"></script>
    <!-- example use of static js library -->
    <script src="d3.min.js"></script>

    <script>
        function printRestData() {
            url = d3.select("#urlbox").property("value").trim();
            fetchRestData(url).then((data) => {
                console.log("returned data: " + data);
                d3.select("#my_dataviz").text(data);
            },
                (error) => {
                    d3.select("#my_dataviz").text(error);
                }
            );
        }
    </script>
</body>

</html>
