name: C/C++ CI

on:
  push:
    branches: [ '**' ]
    tags:
      - '*'
  workflow_dispatch: {}

jobs:
  format-check:
    needs: []
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v6
    - name: check
      run: |
        # /usr/bin/git config --global --add safe.directory $GITHUB_WORKSPACE
        clang-format -i -style=file --dump-config
        find . \( -name '*.cpp' -or -name '*.hpp' \) -exec clang-format -i -style=file '{}' ';'
        git diff
        exit $(git status -s | wc -l)

  build:
    needs: [format-check]
    runs-on: self-hosted
    strategy:
      matrix:
        build-type: [Release, Debug] # Sanitize
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
    - name: configure
      run: |
        mkdir ${{ matrix.build-type }}
        cd ${{ matrix.build-type }}
        CXX=clang++ CC=clang cmake -DCMAKE_INSTALL_PREFIX=../install -DRacket_ROOT=/usr -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_FLAGS:STRING="-std=c++17" -DCMAKE_CXX_CLANG_TIDY=clang-tidy -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
        cd ..
    - name: build
      run: |
        cmake --build ${{ matrix.build-type }} -- -j $(nproc)
    - name: install
      run: cmake --build ${{ matrix.build-type }} --target install
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.build-type }}
        retention-days: 1
        path: |
          install

  # Builds the stress harness with ThreadSanitizer. The per-thread run and the --direct run must be
  # race-free. The shared-context run is expected to race and only shows that TSan reports it.
  concurrency-stress:
    needs: [format-check]
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
    - name: configure
      # The C flags instrument chibi too, so that TSan sees chibi's own globals. chibi's install
      # step links the chibi-scheme executable against the instrumented library, which needs
      # the TSan runtime and therefore the linker flag.
      run: |
        mkdir -p tsan
        cd tsan
        CXX=clang++ CC=clang cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS:STRING="-std=c++17" -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g -DNDEBUG -fsanitize=thread" -DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO="-fsanitize=thread" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
        cd ..
    - name: build harness
      run: cmake --build tsan --target boss_concurrency_stress -- -j $(nproc)
    - name: per-thread check (pure suite, no warm-up, must be race-free)
      run: |
        TSAN_OPTIONS="halt_on_error=1 abort_on_error=1" \
          ./tsan/boss_concurrency_stress --mode per-thread --suite pure --threads 8 --iters 2000 --no-warmup
    - name: baseline (shared ctx — expected to report a race; informational)
      # halt_on_error=1 makes TSan abort on the first race rather than running on into the
      # corruption it just reported (which is nondeterministic and can hang). `timeout` is a
      # belt-and-suspenders guard so a hang can never stall the job. Informational (|| true):
      # this config is the known-unsafe baseline, present only to confirm TSan still catches it.
      run: |
        TSAN_OPTIONS="halt_on_error=1 abort_on_error=1" \
          timeout 120 ./tsan/boss_concurrency_stress --mode shared --suite pure --threads 8 --iters 500 || true
    - name: dispatch + reconfiguration check (--direct mixed, must be race-free)
      # The mixed suite interleaves ordinary evaluations, which take the dispatch path, with
      # SetDefaultEnginePipeline and ResetEngines. --direct skips chibi, whose parse and GC work
      # hides the dispatch window from TSan.
      run: |
        TSAN_OPTIONS="halt_on_error=1 abort_on_error=1" \
          ./tsan/boss_concurrency_stress --direct --suite mixed --threads 8 --iters 5000
    - name: configure Debug (tripwire)
      run: |
        mkdir -p tripwire
        cd tripwire
        CXX=clang++ CC=clang cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS:STRING="-std=c++17" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
        cd ..
    - name: build harness (Debug)
      run: cmake --build tripwire --target boss_concurrency_stress -- -j $(nproc)
    - name: tripwire check (Debug shared context must abort with the tripwire message)
      # ConcurrencyTripwire compiles away outside Debug, so the RelWithDebInfo runs above cannot
      # see it. report_bugs=0 stops TSan from reporting the shared-context race, so the run ends
      # only if the tripwire aborts it; the step fails if the run exits normally or if the log
      # lacks the tripwire's message.
      run: |
        if TSAN_OPTIONS="report_bugs=0" timeout 120 ./tripwire/boss_concurrency_stress --mode shared --suite pure --threads 8 --iters 500 > tripwire.log 2>&1; then
          echo "expected ConcurrencyTripwire to abort the shared-context run"
          cat tripwire.log
          exit 1
        fi
        grep -q "BOSS ConcurrencyTripwire" tripwire.log || { cat tripwire.log; exit 1; }

  release:
    runs-on: self-hosted
    strategy:
      matrix:
        build-type: [Release, Debug]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.build-type }}
          path: ${{ matrix.build-type }}
      - name: Set output
        id: vars
        run: echo "short_ref=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
      - name: list files
        run: find .
      - name: create tarball
        run: tar --strip-components=1 -czf ${{ runner.os }}-${{ matrix.build-type }}.tar.gz ${{ matrix.build-type }}
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ runner.os }}-${{ matrix.build-type }}.tar.gz
          name: ${{ steps.vars.outputs.short_ref }}
    needs: [build]
