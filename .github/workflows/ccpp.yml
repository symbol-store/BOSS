name: C/C++ CI

on:
  push:
    branches: [ '*' ]
    tags:
      - '*'
  pull_request:
    branches: [ '*' ]
  workflow_dispatch: {}

jobs:
  # check-runner queries the GitHub API to detect idle self-hosted runners and
  # routes subsequent jobs to them, falling back to ubuntu-latest when none are
  # available. It requires GitHub Actions credits (ubuntu-latest runner) and is
  # therefore disabled while the monthly credit budget is exhausted.
  #
  # To re-enable the fallback mechanism:
  #   1. Uncomment this entire check-runner job.
  #   2. In format-check: replace `needs: []` with `needs: [check-runner]`
  #      and replace `runs-on: self-hosted` with
  #      `runs-on: ${{ needs.check-runner.outputs.runner }}`
  #   3. In build: replace `needs: [format-check]` with
  #      `needs: [format-check, check-runner]` and replace
  #      `runs-on: self-hosted` with
  #      `runs-on: ${{ needs.check-runner.outputs.runner }}`
  #
  # check-runner:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     actions: read
  #   outputs:
  #     runner: ${{ steps.pick.outputs.runner }}
  #   steps:
  #     - name: Check self-hosted runner availability
  #       id: pick
  #       env:
  #         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #       run: |
  #         AVAILABLE=$(curl -s \
  #           -H "Authorization: Bearer $GH_TOKEN" \
  #           -H "Accept: application/vnd.github+json" \
  #           "https://api.github.com/repos/${{ github.repository }}/actions/runners?per_page=100" \
  #           | jq '[.runners[] | select(.status=="online" and .busy==false)] | length')
  #         if [ "$AVAILABLE" -gt 0 ]; then
  #           echo "runner=self-hosted" >> "$GITHUB_OUTPUT"
  #           echo "Self-hosted runners available: $AVAILABLE — using self-hosted"
  #         else
  #           echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
  #           echo "No self-hosted runners available — falling back to ubuntu-latest"
  #         fi

  format-check:
    needs: []  # restore to: needs: [check-runner]
    runs-on: self-hosted  # restore to: runs-on: ${{ needs.check-runner.outputs.runner }}
    steps:
    - uses: actions/checkout@v6
    - name: check
      run: |
        # /usr/bin/git config --global --add safe.directory $GITHUB_WORKSPACE
        clang-format -i -style=file --dump-config
        find . \( -name '*.cpp' -or -name '*.hpp' \) -exec clang-format -i -style=file '{}' ';'
        git diff
        exit $(git status -s | wc -l)

  build:
    needs: [format-check]  # restore to: needs: [format-check, check-runner]
    runs-on: self-hosted  # restore to: runs-on: ${{ needs.check-runner.outputs.runner }}
    strategy:
      matrix:
        build-type: [Release, Debug] # Sanitize
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
    - name: configure
      run: |
        mkdir ${{ matrix.build-type }}
        cd ${{ matrix.build-type }}
        CXX=clang++ CC=clang cmake -DCMAKE_INSTALL_PREFIX=../install -DRacket_ROOT=/usr -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_FLAGS:STRING="-std=c++17" -DCMAKE_CXX_CLANG_TIDY=clang-tidy -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
        cd ..
    - name: build
      run: |
        cmake --build ${{ matrix.build-type }} -- -j $(nproc)
    - name: install
      run: cmake --build ${{ matrix.build-type }} --target install
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.build-type }}
        retention-days: 1
        path: |
          install

  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [Release, Debug]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.build-type }}
          path: ${{ matrix.build-type }}
      - name: Set output
        id: vars
        run: echo "short_ref=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
      - name: list files
        run: find .
      - name: create tarball
        run: tar --strip-components=1 -czf ${{ runner.os }}-${{ matrix.build-type }}.tar.gz ${{ matrix.build-type }}
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ runner.os }}-${{ matrix.build-type }}.tar.gz
          name: ${{ steps.vars.outputs.short_ref }}
    needs: [build]
